# ==============================================================================
# LEGALAI MÉXICO - INFRAESTRUCTURA DE PRODUCCIÓN (DOCKER COMPOSE HARDENED)
# ==============================================================================
# Redes aisladas por capas (Frontend, Backend, IA Privada)
# Cifrado en tránsito (TLS 1.3), secretos protegidos y respaldo automatizado
# ==============================================================================

version: '3.8'

services:
  # 1. Reverse Proxy Nginx (Terminación TLS y Blindaje Web)
  nginx:
    image: nginx:1.27-alpine
    container_name: legal_ai_prod_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 2. Frontend Next.js (Standalone Runner)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal_ai_prod_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
    expose:
      - "3000"
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  # 3. Backend FastAPI (Capa de Negocio y Seguridad)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal_ai_prod_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_ALLOW_PUBLIC_IPS=false
      - SECRET_KEY=${SECRET_KEY}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_PATH=/app/storage/tenants
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-legal-ai-documents-vault}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
    expose:
      - "8000"
    volumes:
      - storage_data:/app/storage
      - app_logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
      - ai_private_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # 4. Trabajador Asíncrono (Extracción, OCR, Tareas en Cola)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal_ai_prod_worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.worker"]
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OLLAMA_ALLOW_PUBLIC_IPS=false
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_STORAGE_PATH=/app/storage/tenants
    volumes:
      - storage_data:/app/storage
      - app_logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - ai_private_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # 5. Base de Datos PostgreSQL 16 con Extensión pgvector Oficial
  db:
    image: pgvector/pgvector:pg16
    container_name: legal_ai_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # 6. Broker de Caché y Cola Redis 7 con Autenticación
  redis:
    image: redis:7-alpine
    container_name: legal_ai_prod_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # 7. Servicio Automatizado de Copias de Seguridad Cifradas (Backup Daemon)
  db_backup:
    image: postgres:16-alpine
    container_name: legal_ai_prod_backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-secret_aes_backup_key}
      - BACKUP_RETENTION_DAYS=30
    volumes:
      - backups_prod:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache openssl
        echo "0 2 * * * /scripts/backup_db.sh" > /etc/crontabs/root
        crond -f -d 8
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net

volumes:
  pgdata_prod:
    driver: local
  redisdata_prod:
    driver: local
  storage_data:
    driver: local
  backups_prod:
    driver: local
  nginx_logs:
    driver: local
  app_logs:
    driver: local

networks:
  frontend_net:
    driver: bridge
    internal: false
  backend_net:
    driver: bridge
    internal: true
  ai_private_net:
    driver: bridge
    internal: false
